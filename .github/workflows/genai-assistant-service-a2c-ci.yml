# genai-assistant-service — delivery pipeline (generated by A2C CICDAgent).
# test -> iac -> image (build + Trivy scan) -> deploy. The deploy job is
# defined but switched off: it runs only when the repository variable
# DEPLOY_ENABLED is 'true' and OIDC trust to gcp has been configured.
name: genai-assistant-service delivery

on:
  push:
    branches: [main]
    paths: ["genai-assistant-service/**", ".github/workflows/genai-assistant-service-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-assistant-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        if: hashFiles('genai-assistant-service/pom.xml') != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: genai-assistant-service/pom.xml
      - name: Test (Maven)
        if: hashFiles('genai-assistant-service/pom.xml') != ''
        run: mvn -B verify
      - name: Set up Python
        if: hashFiles('genai-assistant-service/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test (Poetry)
        if: hashFiles('genai-assistant-service/pyproject.toml') != ''
        run: |
          pipx install "poetry>=2.0,<3"
          poetry install --no-interaction
          poetry run pytest -q

  iac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-assistant-service/infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      - run: terraform init -backend=false -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform test

  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-assistant-service
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - name: Build the container image
        run: docker build -t genai-assistant-service:${{ github.sha }} .
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "genai-assistant-service:${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Where is the finding? (only when the scan fails)
        if: failure()
        run: |
          docker run --rm --entrypoint sh genai-assistant-service:${{ github.sha }} -c '
            echo "--- every setuptools in the image"; find / -xdev \( -iname "setuptools*" -o -iname "pkg_resources" \) -not -path "/proc/*" 2>/dev/null | head -40
            echo "--- files that say 70.3.0"; grep -rIl "70\.3\.0" /app /usr/local/lib/python3.12 2>/dev/null | head -20'

  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-assistant-service
    needs: [test, iac, image]
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      - name: Authenticate to gcp with OIDC
        run: echo "Add the gcp OIDC login action here once a cloud account exists."
      - name: Deploy
        working-directory: genai-assistant-service/infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Roll back on failure
        if: failure()
        run: echo "Re-deploy the previous image tag (rollback) and page the owner."
